        new File(rightGroundBowRunDirectory, 'options.txt').text = 'version:5023\nonboardAccessibility:false\npauseOnLostFocus:false\nenableVsync:false\nmaxFps:120\nrenderDistance:4\nlang:zh_cn\n'
