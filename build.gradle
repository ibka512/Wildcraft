    doLast {
        if (!acceptTestEula) throw new GradleException('Local lab requires -PacceptMinecraftEula=true.')
        def modsDir = new File(p8Lab, 'mods'); modsDir.mkdirs()
        java.nio.file.Files.copy(tasks.named('jar', Jar).get().archiveFile.get().asFile.toPath(), new File(modsDir, 'wildcraft.jar').toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        java.nio.file.Files.copy(gameTestJar.get().archiveFile.get().asFile.toPath(), new File(modsDir, 'wildcraft-test.jar').toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        def serverDir = new File(p8Lab, 'server'); serverDir.mkdirs()
        new File(serverDir, 'eula.txt').text = 'eula=true\n'
        new File(serverDir, 'server.properties').text = 'server-ip=127.0.0.1\nserver-port=25639\nonline-mode=false\nenforce-secure-profile=false\nwhite-list=false\nmax-players=2\nview-distance=4\nsimulation-distance=4\nallow-flight=false\nlevel-name=P8Lab\nlevel-type=minecraft:normal\nspawn-protection=0\n'
        ['actor', 'observer'].each { role ->
            def clientDir = new File(p8Lab, role); clientDir.mkdirs()
            new File(clientDir, 'options.txt').text = 'version:5023\nonboardAccessibility:false\npauseOnLostFocus:false\nmaxFps:30\nrenderDistance:4\nlang:zh_cn\n'
        }
    }
}
tasks.register('runP8Server', net.fabricmc.loom.task.prod.ServerProductionRunTask) {
    mods.setFrom(new File(p8Lab, 'mods/wildcraft.jar'), new File(p8Lab, 'mods/wildcraft-test.jar'), configurations.productionRuntimeMods)
    jvmArgs.addAll('-Xmx1G', '-Dwildcraft.p8.server=true'); runDir = new File(p8Lab, 'server')
}
['actor', 'observer'].each { role ->
    tasks.register("runP8${role.capitalize()}", net.fabricmc.loom.task.prod.ClientProductionRunTask) {
        mods.setFrom(new File(p8Lab, 'mods/wildcraft.jar'), new File(p8Lab, 'mods/wildcraft-test.jar'), configurations.productionRuntimeMods)
        jvmArgs.addAll('-Xmx2G', "-Dwildcraft.p8.role=${role}")
        programArgs.addAll('--username', "WC${role.capitalize()}", '--quickPlayMultiplayer', '127.0.0.1:25639')
        useXVFB = false; runDir = new File(p8Lab, role)
    }
}

