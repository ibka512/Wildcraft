// The C0 scheduling probe uses a copy of an existing disposable research world.
tasks.register('runInputNativeProbe', net.fabricmc.loom.task.prod.ClientProductionRunTask) {
    outputs.upToDateWhen { false }; mods.from(gameTestJar)
    jvmArgs.add('-Dwildcraft.c0.native=true'); programArgs.addAll('--quickPlaySingleplayer', 'C0InputRealtime'); useXVFB = false
    runDir = layout.buildDirectory.dir('run/c0-input-native')
    doFirst {
        def source = layout.buildDirectory.dir('run/input-client-test/saves/New World').get().asFile.toPath()
        def directory = layout.buildDirectory.dir('run/c0-input-native').get().asFile.toPath()
        def target = directory.resolve('saves/C0InputRealtime')
        if (!java.nio.file.Files.exists(target.resolve('level.dat'))) {
            if (!java.nio.file.Files.exists(source.resolve('level.dat'))) throw new GradleException('Disposable input-client-test New World fixture required; do not use a personal world.')
            java.nio.file.Files.walk(source).withCloseable { paths -> paths.forEach { input ->
                def name = input.fileName.toString()
                if (!name.startsWith('._') && name != 'session.lock' && name != '.DS_Store') {
                    def output = target.resolve(source.relativize(input))
                    if (java.nio.file.Files.isDirectory(input)) java.nio.file.Files.createDirectories(output)
                    else java.nio.file.Files.copy(input, output, java.nio.file.StandardCopyOption.REPLACE_EXISTING)
                }
            } }
        }
        java.nio.file.Files.writeString(directory.resolve('options.txt'), 'version:5023\nonboardAccessibility:false\npauseOnLostFocus:false\nmaxFps:120\nrenderDistance:4\nlang:zh_cn\n')
    }
}


