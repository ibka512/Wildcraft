// Actual RIGHT ground-bow regression using the existing packaged runtime.
def rightGroundBowMetadataDirectory = layout.buildDirectory.dir('rightGroundBow-metadata').get().asFile
def rightGroundBowMetadata = tasks.register('rightGroundBowMetadata') {
    inputs.file(coreArtMetadataSource)
    inputs.property('rightGroundBowPair',providers.gradleProperty('rightGroundBowPair').orElse('false').get())
    inputs.property('rightGroundBowFull',providers.gradleProperty('rightGroundBowFull').orElse('false').get())
    if(providers.gradleProperty('rightGroundBowFull').orElse('false').get().toBoolean()) dependsOn('jumpMetadata')
    inputs.property('rightGroundBowReachProbe',providers.gradleProperty('rightGroundBowReachProbe').orElse('false').get())
    outputs.dir(rightGroundBowMetadataDirectory)
    doLast {
        def metadata = new groovy.json.JsonSlurper().parse(coreArtMetadataSource)
        metadata.entrypoints['fabric-client-gametest'] = providers.gradleProperty('rightGroundBowReachProbe').orElse('false').get().toBoolean() ? ['dev.wildcraft.test.RightBowReachProbe'] : ['dev.wildcraft.test.RightGroundBowRigClientTest']
        if(providers.gradleProperty('rightGroundBowPair').orElse('false').get().toBoolean()) metadata.entrypoints['fabric-client-gametest'] = ['dev.wildcraft.test.RightGroundBowRigClientTest', 'dev.wildcraft.test.ActionHandoverClientTest']
        if(providers.gradleProperty('rightGroundBowFull').orElse('false').get().toBoolean()) {
            if(providers.gradleProperty('jumpOnly').orElse('false').get().toBoolean()) throw new GradleException('rightGroundBowFull requires the full existing jump regression')
            def previous = new groovy.json.JsonSlurper().parse(layout.buildDirectory.file('jump-metadata/fabric.mod.json').get().asFile)
            metadata.entrypoints['fabric-client-gametest'] = ['dev.wildcraft.test.RightGroundBowRigClientTest', 'dev.wildcraft.test.ActionHandoverClientTest', 'dev.wildcraft.test.TraversalHandoverClientTest'] + previous.entrypoints['fabric-client-gametest']
        }
        metadata.entrypoints.client += ['dev.wildcraft.test.research.animation.AnimationResearchClient']
        rightGroundBowMetadataDirectory.mkdirs()
        new File(rightGroundBowMetadataDirectory, 'fabric.mod.json').text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(metadata)) + '\n'
    }
}
def rightGroundBowTestJar = tasks.register('rightGroundBowTestJar', Jar) {
    dependsOn rightGroundBowMetadata
    archiveClassifier = 'rightGroundBow'
    from(sourceSets.gametest.output) { exclude 'fabric.mod.json' }
    from(rightGroundBowMetadataDirectory)
}
