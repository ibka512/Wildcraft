def c7PerformanceRunDirectory = file(providers.gradleProperty('c7PerformanceRunDir').orElse(layout.buildDirectory.dir('run/c7-native-baseline').get().asFile.absolutePath).get())
def c7PerformanceFixturePath = providers.gradleProperty('c7PerformanceFixture').orElse('').get()
def c7PerformanceSampleSeconds = providers.gradleProperty('c7PerformanceSampleSeconds').orElse('15').get()
def c7PerformanceRounds = providers.gradleProperty('c7PerformanceRounds').orElse('1').get()
def c7PerformanceControlledOnly = providers.gradleProperty('c7PerformanceControlledOnly').orElse('false').get()
def c7PerformanceLanguage = providers.gradleProperty('c7PerformanceLanguage').orElse('zh_cn').get()
def c7PerformanceWater = providers.gradleProperty('c7PerformanceWater').orElse('false').get().toBoolean()
def c7PerformanceParts = providers.gradleProperty('c7PerformanceParts').orElse('false').get().toBoolean()
def c7PerformancePartsMode = providers.gradleProperty('c7PerformancePartsMode').orElse('rocket').get()
def c7PerformanceTerrain = providers.gradleProperty('c7PerformanceTerrain').orElse('false').get().toBoolean()
def c7PerformanceDriving = providers.gradleProperty('c7PerformanceDriving').orElse('false').get().toBoolean()
def c7PerformanceMainJar = file(providers.gradleProperty('c7PerformanceMainJar').orElse('development-assets/local-only/dev62/final/wildcraft-0.1.0-dev.62+mc26.3.jar').get())
tasks.register('runC7NativeRenderBaseline',net.fabricmc.loom.task.prod.ClientProductionRunTask) {
    outputs.upToDateWhen { false }; dependsOn c7PerformanceTestJar
    mods.setFrom(c7PerformanceMainJar,c7PerformanceTestJar,configurations.productionRuntimeMods)
    jvmArgs.add('-Dwildcraft.c7.nativeFocusAudit='+providers.gradleProperty('c7PerformanceNativeFocusAudit').orElse('false').get())
    jvmArgs.addAll('-Dwildcraft.c7.partsBaseline='+c7PerformanceParts,'-Dwildcraft.c7.partsMode='+c7PerformancePartsMode)
    jvmArgs.add('-Dwildcraft.c7.partsUIRequired='+providers.gradleProperty('c7PerformancePartsUIRequired').orElse('false').get())
    jvmArgs.addAll('-Xmx2G','-Dwildcraft.c7.renderBaseline=true', '-Dwildcraft.c7.requireFocus='+providers.gradleProperty('c7PerformanceRequireFocus').orElse('false').get(), '-Dwildcraft.c7.focusLossProbe='+providers.gradleProperty('c7PerformanceFocusLossProbe').orElse('false').get(), '-Dwildcraft.c7.driveBaseline='+providers.gradleProperty('c7PerformanceDriving').orElse('false').get(), '-Dwildcraft.c7.naturalDriving='+providers.gradleProperty('c7PerformanceNaturalDriving').orElse('false').get(), '-Dwildcraft.c7.drivingUIRequired='+providers.gradleProperty('c7DrivingUIRequired').orElse('false').get(), '-Dwildcraft.c7.terrainBaseline='+providers.gradleProperty('c7PerformanceTerrain').orElse('false').get(), '-Dwildcraft.c7.waterBaseline='+c7PerformanceWater, '-Dwildcraft.c7.waterUIRequired='+providers.gradleProperty('c7WaterUIRequired').orElse('false').get(), '-Dwildcraft.c7.renderDistance='+providers.gradleProperty('c7PerformanceRenderDistance').orElse('16').get(), '-Dwildcraft.c7.frameLimit='+providers.gradleProperty('c7PerformanceFrameLimit').orElse('120').get(), '-Dwildcraft.c7.sampleSeconds='+c7PerformanceSampleSeconds, '-Dwildcraft.c7.rounds='+c7PerformanceRounds, '-Dwildcraft.c7.controlledOnly='+c7PerformanceControlledOnly, '-Dwildcraft.c7.viewportChangeProbe='+providers.gradleProperty('c7PerformanceViewportChangeProbe').orElse('false').get())
    programArgs.addAll('--quickPlaySingleplayer','C7NativeBaseline','--width',providers.gradleProperty('c7PerformanceWindowWidth').orElse('1280').get(),'--height',providers.gradleProperty('c7PerformanceWindowHeight').orElse('960').get())
    if(c7PerformanceParts)programArgs.addAll('--username',providers.gradleProperty('c7PerformanceUsername').orElse('C7NativeParts').get())
    useXVFB = false; runDir.set(c7PerformanceRunDirectory)
    doFirst {
        if((c7PerformanceTerrain ? 1:0)+(c7PerformanceDriving ? 1:0)+(c7PerformanceWater ? 1:0)+(c7PerformanceParts ? 1:0)>1) throw new GradleException('Choose only one of water, terrain, driving or parts')
        if(c7PerformanceParts && !['rocket','rocket-reopen','spring','spring-reopen'].contains(c7PerformancePartsMode)) throw new GradleException('Choose an explicit native parts lifecycle mode')
        def seconds = Integer.parseInt(c7PerformanceSampleSeconds)
        def rounds = Integer.parseInt(c7PerformanceRounds)
        def cases = c7PerformanceControlledOnly.toBoolean() ? 3 : 6
        if(seconds < 15 || seconds > 120 || rounds < 1 || rounds > 5 || cases*rounds*(seconds+5) > 1800) throw new GradleException('Native sample must be15..120s,1..5rounds, at most30minutes; no unbounded background client')
        if(c7PerformanceFixturePath.isEmpty()) throw new GradleException('Provide an existing generated disposable test world; never use a personal save')
        def source = java.nio.file.Path.of(c7PerformanceFixturePath)
        def target = c7PerformanceRunDirectory.toPath().resolve('saves/C7NativeBaseline')
        if(!java.nio.file.Files.exists(source.resolve('level.dat')) || java.nio.file.Files.exists(target)) throw new GradleException('Require a valid generated test fixture and fresh destination; no existing world is overwritten')
        java.nio.file.Files.walk(source).withCloseable { paths ->
            paths.forEach { path ->
                def name = path.fileName.toString()
