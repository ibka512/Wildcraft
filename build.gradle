plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

def localRuntime = projectDir.parentFile
def defaultCacheHome = new File(System.getProperty('user.home'), 'Library/Caches/Wildcraft')
if (new File(localRuntime, '.wildcraft-runtime').isFile()) {
    defaultCacheHome = new File(localRuntime, 'cache')
}
def wildcraftCacheHome = new File(providers.environmentVariable('WILDCRAFT_CACHE_HOME')
        .getOrElse(defaultCacheHome.absolutePath))

if (System.getProperty('os.name').startsWith('Mac')) {
    // ExFAT creates AppleDouble files which Minecraft mistakes for resources.
    def projectKey = java.security.MessageDigest.getInstance('SHA-256')
            .digest(projectDir.absolutePath.getBytes('UTF-8')).encodeHex().toString().substring(0, 12)
    layout.buildDirectory = new File(wildcraftCacheHome, "builds/${projectKey}")
}

loom {
    splitEnvironmentSourceSets()
    mods {
        wildcraft {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    productionRuntimeMods "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
}

def acceptTestEula = providers.gradleProperty('acceptMinecraftEula')
        .map { it.toBoolean() }.getOrElse(false)

fabricApi {
    configureDataGeneration {
        client = true
    }
    configureTests {
        createSourceSet = true
        modId = 'wildcraft-test'
        enableGameTests = true
        enableClientGameTests = true
        eula = acceptTestEula
    }
}

loom.runs.configureEach { run ->
    run.runDirectory.set(layout.buildDirectory.dir("run/${run.name}"))
    if (run.name == 'gameTest') {
        run.vmArg '-Dfabric-api.gametest.report-file=reports/gametest-results.xml'
    }
}

loom.runs {
    r1Client {
        client()
        source sourceSets.gametest
        runDirectory.set(layout.buildDirectory.dir('run/r1-client'))
        vmArg '-Dwildcraft.r1.native=true'
        vmArg '-Dwildcraft.r1.frameRelease=true'
        programArg '--quickPlaySingleplayer'
        programArg 'R1Realtime'
    }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

sourceSets {
    rulesTest {
        java.srcDir 'src/rulesTest/java'
        compileClasspath += sourceSets.main.output
        runtimeClasspath += output + compileClasspath
    }
}

def verifyRules = tasks.register('verifyRules', JavaExec) {
    dependsOn tasks.named('rulesTestClasses')
    classpath = sourceSets.rulesTest.runtimeClasspath
    mainClass = 'dev.wildcraft.test.StaminaRulesCheck'
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

def verifyTemperatureRules = tasks.register('verifyTemperatureRules', JavaExec) {
    dependsOn tasks.named('rulesTestClasses')
    classpath = sourceSets.rulesTest.runtimeClasspath
    mainClass = 'dev.wildcraft.test.TemperatureRulesCheck'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
}
tasks.named('check') {
    dependsOn verifyRules, verifyTemperatureRules
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}

tasks.withType(ProcessResources).configureEach {
    exclude '**/._*', '**/.DS_Store'
}

def modVersion = project.version
processResources {
    inputs.property 'version', modVersion
    filesMatching('fabric.mod.json') {
        expand version: modVersion
    }
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    exclude '**/._*', '**/.DS_Store'
}

jar {
    from('LICENSE', 'NOTICE.md')
}

def exportMod = tasks.register('exportMod', Copy) {
    dependsOn tasks.named('jar')
    from tasks.named('jar', Jar).flatMap { it.archiveFile }
    into layout.projectDirectory.dir('dist')
}

tasks.named('build') {
    dependsOn exportMod
}

def gameTestJar = tasks.register('gameTestJar', Jar) {
    archiveClassifier = 'gametest'
    from sourceSets.gametest.output
}

tasks.register('runPackagedClientTest', net.fabricmc.loom.task.prod.ClientProductionRunTask) {
    mods.from(gameTestJar)
    jvmArgs.add('-Dfabric.client.gametest')
    useXVFB = false
    runDir = layout.buildDirectory.dir('run/packaged-client-test')
}

if (acceptTestEula) {
    def acceptPackagedTestEula = tasks.register('acceptPackagedClientTestEula', Copy) {
        dependsOn tasks.named('acceptGameTestEula')
        from layout.buildDirectory.file('run/clientGameTest/eula.txt')
        into layout.buildDirectory.dir('run/packaged-client-test')
    }
    tasks.named('runPackagedClientTest') {
        dependsOn acceptPackagedTestEula
    }
}

tasks.register('runPackagedServer', net.fabricmc.loom.task.prod.ServerProductionRunTask) {
    jvmArgs.add('-Xmx1G')
    runDir = layout.buildDirectory.dir('run/packaged-server')
}


// Freeze the two mod jars before starting concurrent processes; no process rebuilds an open jar.
def p31Lab = new File(wildcraftCacheHome, 'labs/p31')
tasks.register('prepareP31Lab') {
    dependsOn tasks.named('jar'), gameTestJar
    doLast {
        if (!acceptTestEula) throw new GradleException('Local lab requires the previously authorized -PacceptMinecraftEula=true flag.')
        def modsDir = new File(p31Lab, 'mods')
        modsDir.mkdirs()
        java.nio.file.Files.copy(tasks.named('jar', Jar).get().archiveFile.get().asFile.toPath(), new File(modsDir, 'wildcraft.jar').toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        java.nio.file.Files.copy(gameTestJar.get().archiveFile.get().asFile.toPath(), new File(modsDir, 'wildcraft-test.jar').toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        def serverDir = new File(p31Lab, 'server')
        serverDir.mkdirs()
        new File(serverDir, 'eula.txt').text = 'eula=true\n'
        new File(serverDir, 'server.properties').text = 'server-ip=127.0.0.1\nserver-port=25631\nonline-mode=false\nenforce-secure-profile=false\nwhite-list=false\nmax-players=2\nview-distance=4\nsimulation-distance=4\nallow-flight=false\nlevel-name=P31Lab\nlevel-type=minecraft:flat\nspawn-protection=0\n'
        def standaloneDir = new File(p31Lab, 'standalone')
        standaloneDir.mkdirs()
        new File(standaloneDir, 'eula.txt').text = 'eula=true\n'
        new File(standaloneDir, 'server.properties').text = 'server-ip=127.0.0.1\nserver-port=25632\nonline-mode=false\nenforce-secure-profile=false\nwhite-list=false\nmax-players=2\nview-distance=4\nsimulation-distance=4\nallow-flight=false\nlevel-name=P31StandaloneLab\nspawn-protection=0\n'
        ['actor', 'observer'].each { role ->
            def clientDir = new File(p31Lab, role)
            clientDir.mkdirs()
            new File(clientDir, 'options.txt').text = 'onboardAccessibility:false\npauseOnLostFocus:false\nmaxFps:30\nrenderDistance:4\nlang:zh_cn\n'
        }
    }
}
tasks.register('runP31Server', net.fabricmc.loom.task.prod.ServerProductionRunTask) {
    mods.setFrom(new File(p31Lab, 'mods/wildcraft.jar'), new File(p31Lab, 'mods/wildcraft-test.jar'), configurations.productionRuntimeMods)
    jvmArgs.addAll('-Xmx1G', '-Dwildcraft.p31.server=true')
    runDir = new File(p31Lab, 'server')
}
['actor', 'observer'].each { role ->
    tasks.register("runP31${role.capitalize()}", net.fabricmc.loom.task.prod.ClientProductionRunTask) {
        mods.setFrom(new File(p31Lab, 'mods/wildcraft.jar'), new File(p31Lab, 'mods/wildcraft-test.jar'), configurations.productionRuntimeMods)
        jvmArgs.addAll('-Xmx2G', "-Dwildcraft.p31.role=${role}")
        programArgs.addAll('--username', "WC${role.capitalize()}", '--quickPlayMultiplayer', '127.0.0.1:25631')
        useXVFB = false
        runDir = new File(p31Lab, role)
    }
}
// Same frozen production jar, with no test mod present.
tasks.register('runP31StandaloneServer', net.fabricmc.loom.task.prod.ServerProductionRunTask) {
    mods.setFrom(new File(p31Lab, 'mods/wildcraft.jar'), configurations.productionRuntimeMods)
    jvmArgs.add('-Xmx1G')
    runDir = new File(p31Lab, 'standalone')
}

// P3.2 uses ordinary frame/tick scheduling, with no fabric.client.gametest flag.
tasks.register('runP32NativeClient', net.fabricmc.loom.task.prod.ClientProductionRunTask) {
    mods.from(gameTestJar)
    jvmArgs.add('-Dwildcraft.p32.native=true')
    programArgs.addAll('--quickPlaySingleplayer', 'P32Realtime')
    useXVFB = false
    runDir = layout.buildDirectory.dir('run/p32-native-client')
    def fixtureSource = layout.buildDirectory.dir('run/r1-client/saves/R1Realtime').get().asFile.toPath()
    def nativeDirectory = layout.buildDirectory.dir('run/p32-native-client').get().asFile.toPath()
    doFirst {
        def fixtureTarget = nativeDirectory.resolve('saves/P32Realtime')
        if (!java.nio.file.Files.exists(fixtureTarget.resolve('level.dat'))) {
            if (!java.nio.file.Files.exists(fixtureSource.resolve('level.dat'))) throw new GradleException('Prepare a disposable R1Realtime test world first; never use a personal save.')
            java.nio.file.Files.walk(fixtureSource).withCloseable { paths ->
                paths.forEach { source ->
                    def relative = fixtureSource.relativize(source)
                    def name = source.fileName.toString()
                    if (!name.startsWith('._') && name != 'session.lock' && name != '.DS_Store') {
                        def target = fixtureTarget.resolve(relative)
                        if (java.nio.file.Files.isDirectory(source)) java.nio.file.Files.createDirectories(target)
                        else java.nio.file.Files.copy(source, target, java.nio.file.StandardCopyOption.REPLACE_EXISTING)
                    }
                }
            }
        }
        // Version is required: a versionless options file runs migrations which reset onboarding.
        java.nio.file.Files.writeString(nativeDirectory.resolve('options.txt'), 'version:5023\nonboardAccessibility:false\npauseOnLostFocus:false\nmaxFps:120\nrenderDistance:4\nlang:zh_cn\n')
    }
}

// Repeat the art integration checks without replaying unrelated gameplay tests.
def coreArtMetadataSource = file('src/gametest/resources/fabric.mod.json')
def coreArtMetadataDirectory = layout.buildDirectory.dir('core-art-test-metadata').get().asFile
def coreArtMetadata = tasks.register('coreArtTestMetadata') {
    inputs.file(coreArtMetadataSource)
    outputs.dir(coreArtMetadataDirectory)
    doLast {
        def metadata = new groovy.json.JsonSlurper().parse(coreArtMetadataSource)
        metadata.entrypoints['fabric-client-gametest'] = ['dev.wildcraft.test.CoreArtClientSmokeTest']
        def destination = new File(coreArtMetadataDirectory, 'fabric.mod.json')
        destination.parentFile.mkdirs()
        destination.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(metadata))
    }
}
def coreArtTestJar = tasks.register('coreArtTestJar', Jar) {
    dependsOn coreArtMetadata
    archiveClassifier = 'core-art-test'
    from(sourceSets.gametest.output) { exclude 'fabric.mod.json' }
    from(layout.buildDirectory.dir('core-art-test-metadata'))
}
tasks.register('runCoreArtClientTest', net.fabricmc.loom.task.prod.ClientProductionRunTask) {
    outputs.upToDateWhen { false }
    mods.from(coreArtTestJar)
    jvmArgs.add('-Dfabric.client.gametest')
    useXVFB = false
    runDir = layout.buildDirectory.dir('run/core-art-client-test')
}

