def rightAirBowMetadata = tasks.register('rightAirBowMetadata') {
    inputs.file(coreArtMetadataSource)
    inputs.property('rightAirBowFull',providers.gradleProperty('rightAirBowFull').orElse('false').get())
    if(providers.gradleProperty('rightAirBowFull').orElse('false').get().toBoolean()) dependsOn('rightGroundBowMetadata')
    outputs.dir(rightAirBowMetadataDirectory)
    doLast {
        def metadata = new groovy.json.JsonSlurper().parse(coreArtMetadataSource)
        metadata.entrypoints['fabric-client-gametest'] = ['dev.wildcraft.test.RightAirBowRigClientTest']
        if(providers.gradleProperty('rightAirBowFull').orElse('false').get().toBoolean()) {
            def previous = new groovy.json.JsonSlurper().parse(layout.buildDirectory.file('rightGroundBow-metadata/fabric.mod.json').get().asFile)
            if(previous.entrypoints['fabric-client-gametest'].size()!=46) throw new GradleException('rightAirBowFull requires -PrightGroundBowFull=true with all46 existing regression classes')
            metadata.entrypoints['fabric-client-gametest'] = ['dev.wildcraft.test.RightAirBowRigClientTest'] + previous.entrypoints['fabric-client-gametest']
        }
        metadata.entrypoints.client += ['dev.wildcraft.test.research.animation.AnimationResearchClient']
        rightAirBowMetadataDirectory.mkdirs()
        new File(rightAirBowMetadataDirectory, 'fabric.mod.json').text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(metadata)) + '\n'
    }
}
def rightAirBowTestJar = tasks.register('rightAirBowTestJar', Jar) {
    dependsOn rightAirBowMetadata
    archiveClassifier = 'rightAirBow'
    from(sourceSets.gametest.output) { exclude 'fabric.mod.json' }
    from(rightAirBowMetadataDirectory)
}
def rightAirBowRunDirectory = file(providers.gradleProperty('rightAirBowRunDir').orElse(layout.buildDirectory.dir('run/rightAirBow-client-test').get().asFile.absolutePath).get())
tasks.register('runRightAirBowRigClientTest', net.fabricmc.loom.task.prod.ClientProductionRunTask) {
    outputs.upToDateWhen { false }
    mods.from(rightAirBowTestJar)
    jvmArgs.add('-Dfabric.client.gametest')
    jvmArgs.add('-Dwildcraft.test.singleplayerOnly=true')
    if(providers.gradleProperty('rightAirBoundaryOnly').orElse('false').get().toBoolean()) jvmArgs.add('-Dwildcraft.test.rightAirBoundaryOnly=true')
    if(providers.gradleProperty('rightAirClockOnly').orElse('false').get().toBoolean()) jvmArgs.add('-Dwildcraft.test.rightAirClockOnly=true')
    useXVFB = false
    runDir.set(rightAirBowRunDirectory)
    doFirst {
        rightAirBowRunDirectory.mkdirs()
        new File(rightAirBowRunDirectory, 'screenshots').deleteDir()
        new File(rightAirBowRunDirectory, 'options.txt').text = 'version:5023\nonboardAccessibility:false\npauseOnLostFocus:false\nenableVsync:false\nmaxFps:120\nrenderDistance:4\nlang:zh_cn\n'
    }
}


